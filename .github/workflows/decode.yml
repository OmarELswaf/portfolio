name: Decode staged base64 assets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  decode:
    if: "!contains(github.event.head_commit.message, 'Decode staged base64 assets')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract bundle
        run: |
          base64 -d bundle.tar.gz.b64 > bundle.tar.gz
          tar xzf bundle.tar.gz
          rm -f bundle.tar.gz bundle.tar.gz.b64
          rm -f .github/workflows/decode.yml
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decode staged base64 assets" || echo "nothing to commit"
          git push
